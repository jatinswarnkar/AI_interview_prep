version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interview_copilot_backend
    volumes:
      - ./backend/media:/app/media
      - ./backend/rag/index:/app/rag/index
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: interview_copilot_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
