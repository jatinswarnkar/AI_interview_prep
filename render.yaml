services:
  # 1. Django Backend Web Service (Docker-based)
  - type: web
    name: interview-copilot-backend
    env: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: AZURE_OPENAI_API_KEY
        sync: false # User will input their key in the Render dashboard
      - key: AZURE_OPENAI_ENDPOINT
        sync: false # User will input their endpoint in the Render dashboard
      - key: AZURE_OPENAI_DEPLOYMENT_NAME
        sync: false # User will input their deployment name in the Render dashboard
      - key: AZURE_OPENAI_API_VERSION
        value: "2024-08-01-preview"

  # 2. React Frontend Static Site (Served statically for FREE)
  - type: web
    name: interview-copilot-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/dist
    routes:
      # Rewrites frontend /api/* requests to point directly to your backend Web Service URL
      - type: rewrite
        source: /api/*
        destination: https://interview-copilot-backend.onrender.com/api/*
