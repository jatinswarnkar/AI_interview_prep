services:
  # 1. Django Backend Web Service (Docker-based)
  - type: web
    runtime: docker
    name: interview-copilot-backend
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://interview-copilot-frontend.onrender.com"
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT_NAME
        sync: false
      - key: AZURE_OPENAI_API_VERSION
        value: "2024-08-01-preview"

  # 2. React Frontend Static Site
  - type: web
    runtime: static
    name: interview-copilot-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://interview-copilot-backend-6h6i.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
